name: test-and-deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-2
  TF_VERSION: 1.14.4

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Edge auth tests
        run: node --test infra/arena/edge/index.test.mjs
      - name: Web app (type check, engine tests, static export)
        working-directory: web
        run: |
          npm ci --ignore-scripts
          npx tsc --noEmit
          node --test tests/engine.test.ts
          npm run build
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - name: Python tests
        run: |
          uv run python -m unittest arena.tests.test_arena arena.tests.test_remote_env arena.tests.test_provenance arena.tests.test_studies arena.tests.test_watch arena.tests.test_mcp arena.tests.test_mcp_remote
          uv run python -m unittest discover -s modeling/tests -t .
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: Terraform fmt / validate
        run: |
          terraform fmt -check -recursive infra
          for d in infra/arena infra/bootstrap infra/mcp; do
            terraform -chdir=$d init -backend=false -input=false >/dev/null
            terraform -chdir=$d validate
          done

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - name: Terraform apply (infra/arena)
        working-directory: infra/arena
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=arena/terraform.tfstate" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="use_lockfile=true" -backend-config="encrypt=true"
          terraform plan -input=false -out=tfplan
          terraform apply -input=false tfplan
          echo "ARENA_REMOTE=$(terraform output -raw arena_remote)" >> "$GITHUB_ENV"
          echo "DASHBOARD_URL=$(terraform output -raw dashboard_url)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Build web app (static export)
        working-directory: web
        run: npm ci --ignore-scripts && npm run build
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - name: Rebuild and publish dashboard from shared runs and studies
        run: |
          uv run python -m arena pull
          uv run python -m arena build
          uv run python -m arena publish
      - name: Smoke check (login is enforced)
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' "$DASHBOARD_URL/")
          data=$(curl -s -o /dev/null -w '%{http_code}' "$DASHBOARD_URL/data.json")
          echo "index=$code data=$data"
          test "$code" = 302 && test "$data" = 401
          echo "### Dashboard deployed: $DASHBOARD_URL" >> "$GITHUB_STEP_SUMMARY"

  mcp:
    # Hosted MCP server: build the arm64 image, push to ECR, deploy the AgentCore runtime
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Image already built for this commit?
        id: exists
        run: |
          if aws ecr describe-images --repository-name s-trader-arena-mcp --image-ids imageTag=${{ github.sha }} >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"; else echo "skip=false" >> "$GITHUB_OUTPUT"; fi
      - uses: docker/setup-buildx-action@v3
        if: steps.exists.outputs.skip == 'false'
      - uses: docker/build-push-action@v6
        if: steps.exists.outputs.skip == 'false'
        with:
          context: .
          file: infra/mcp/Dockerfile
          platforms: linux/arm64
          push: true
          provenance: false
          tags: ${{ steps.ecr.outputs.registry }}/s-trader-arena-mcp:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - name: Terraform apply (infra/mcp)
        working-directory: infra/mcp
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" -backend-config="key=arena/mcp.tfstate" \
            -backend-config="region=${AWS_REGION}" -backend-config="use_lockfile=true" -backend-config="encrypt=true"
          terraform apply -input=false -auto-approve -var "image_tag=${{ github.sha }}" -var "state_bucket=${{ vars.TF_STATE_BUCKET }}"
          echo "MCP_URL=$(terraform output -raw mcp_url)" >> "$GITHUB_ENV"
      - name: Smoke check (unauthenticated calls are rejected)
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$MCP_URL" -H 'Content-Type: application/json' \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/list"}')
          echo "unauthenticated tools/list -> $code"
          test "$code" = 401 || test "$code" = 403
          echo "### MCP server deployed (image ${{ github.sha }})" >> "$GITHUB_STEP_SUMMARY"
