<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Model Arena</title>
<script>
  // apply theme before first paint
  (function () {
    var t = localStorage.getItem("arena-theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    document.documentElement.dataset.theme = t;
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><b>Model Arena</b><span id="trackName"></span></div>
    <nav class="views" role="tablist" aria-label="보기">
      <button role="tab" id="view-board" aria-selected="true" aria-controls="boardView">순위</button>
      <button role="tab" id="view-compare" aria-selected="false" aria-controls="compareView">비교<span class="count" id="compareCount"></span></button>
    </nav>
    <div class="spacer"></div>
    <label class="field"><span class="sr-only">트랙</span><select class="select" id="track"></select></label>
    <button class="btn icon ghost" id="theme" title="화면 테마 바꾸기" aria-label="화면 테마 바꾸기">◐</button>
    <a class="btn ghost" id="logout" href="/_auth/logout" hidden>로그아웃</a>
  </header>

  <main>
    <div class="notice" id="loadError" hidden></div>

    <section class="summary" aria-live="polite">
      <h1 id="headline">불러오는 중…</h1>
      <p id="windowNote"></p>
      <div class="context">
        <div class="segmented" id="splits" role="group" aria-label="평가 구간"></div>
      </div>
    </section>

    <section id="boardView" role="tabpanel" aria-labelledby="view-board">
      <div class="workbench" id="workbench">
        <div class="panel">
          <div class="toolbar">
            <div id="families" role="group" aria-label="모델 종류" style="display:flex;gap:6px;flex-wrap:wrap"></div>
            <button class="toggle" id="gatesOnly" aria-pressed="false"><span class="dot"></span>기준 충족만</button>
            <div class="spacer"></div>
            <label class="field"><span class="sr-only">run 검색</span><input class="search" id="q" type="search" placeholder="run 이름으로 찾기"></label>
          </div>
          <div class="board-wrap">
            <table class="board" id="board">
              <caption class="sr-only">run 순위표. 행을 선택하면 상세가, 체크하면 비교 목록에 추가됩니다.</caption>
              <thead></thead>
              <tbody></tbody>
            </table>
          </div>
          <div class="board-foot">
            <span><span class="legend-band"></span>무작위 기준선 평균 수익 범위</span>
            <span><span class="legend-ci"></span>거래당 평균 순수익 95% 구간</span>
            <span id="rowCount" style="margin-left:auto"></span>
          </div>
        </div>
        <aside class="panel inspector" id="inspector" hidden aria-label="run 상세"></aside>
      </div>
    </section>

    <section id="compareView" role="tabpanel" aria-labelledby="view-compare" hidden></section>
  </main>

  <div class="tray" id="tray" hidden role="region" aria-label="비교 목록">
    <span class="label">비교 목록</span>
    <div class="chips" id="trayChips"></div>
    <button class="btn ghost small" id="trayClear">비우기</button>
    <button class="btn primary small" id="trayOpen">비교 보기</button>
  </div>
  <div class="tip" id="tip" role="tooltip"></div>
  <script src="app.js"></script>
</body>
</html>
